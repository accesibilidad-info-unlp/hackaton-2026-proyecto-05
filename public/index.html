<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Mapa inteligente de planta baja para ubicar aulas, servicios y tramites dentro de la Facultad de Informatica.">
  <title>Mapa inteligente</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <header>
    <div class="logo"><img src="img/images.jpg" alt="Logo UNLP" height="auto" width="30%">
    </div>
    <div class="buttonConf">
      <button id="miBoton" class="btn-abrir" aria-label="Abrir menú de accesibilidad">☰</button>
    </div>
  </header>

  <!-- Menú Lateral de Accesibilidad -->
  <aside id="miMenu" class="sidebar oculto" aria-label="Menú de Accesibilidad">
    <div class="sidebar-header">
      <span class="titulo">Accesibilidad</span>
      <button id="btnCerrar" class="btn-cerrar" aria-label="Cerrar menú">✕</button>
    </div>

    <div class="sidebar-contenido">
      <!-- Control de Tamaño de Fuente -->
      <div class="controles-fuente">
        <p class="control-label">Tamaño de Texto:</p>
        <div class="btn-group">
          <button id="achicar" type="button">- Letra</button>
          <button id="agrandar" type="button">+ Letra</button>
        </div>
      </div>

      <!-- Control de Contraste -->
      <div class="controles-contraste">
        <p class="control-label">Contraste:</p>
        <div class="btn-group">
          <button id="bajarContraste" type="button">- Contraste</button>
          <button id="subirContraste" type="button">+ Contraste</button>
        </div>
      </div>

      <!-- Control de Modos de Color -->
      <div class="control-tema">
        <label for="selectorColor" class="label-tema">Modo de Color:</label>
        <select id="selectorColor">
          <option value="defecto">Predeterminado</option>
          <option value="oscuro">Modo Oscuro</option>
          <option value="daltonismo">Daltonismo (Protanopía/Deuteranopía)</option>
          <option value="baja-vision">Alta Legibilidad (Texto amarillo/Fondo negro)</option>
        </select>
      </div>

      <!-- Visor nodos y pasillos del mapa -->
      <div class="controles-fuente">
        <p class="control-label">Mapa:</p>
        <label class="accessibility-label">
          <input type="checkbox" id="debugToggle" class="accessibility-checkbox">
          Ver nodos y pasillos ocultos
        </label>
      </div>

      <!-- Lector de Voz -->
      <div class="leer">
        <span class="leer_texto">Lector de Voz:</span>
        <button id="btnLeer" type="button" class="btn-bloque">🔊 Leer pantalla</button>

        <div class="controles-reproductor">
          <button id="btnPausar" type="button">⏸ Pausar</button>
          <button id="btnReanudar" type="button">▶ Reanudar</button>
          <button id="btnDetener" type="button">⏹ Detener</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="shell">
    <section class="map-area" aria-label="Mapa inteligente">
      <div class="topbar">
        <div>
          <h1>Mapa de la Facultad de Informática</h1>
          <p id="searchMode">Planta Baja</p>
        </div>
        <div class="controls">
          <button id="clearRoute" type="button">Limpiar ruta</button>
        </div>
      </div>

      <div class="map-frame">
        <svg id="campusMap" role="img" aria-label="Mapa de planta baja"></svg>
      </div>
    </section>

    <aside class="assistant-panel" aria-label="Asistente de mapa">
      <div class="panel-header">
        <h2 id="panelTitle">¿A dónde quieres ir?</h2>
      </div>

      <div class="accessibility-picker">
        <label class="accessibility-label">
          <input type="checkbox" id="check-accesibilidad" class="accessibility-checkbox">
          Activar rutas accesibles (sin gradas)
        </label>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="chatForm" class="chat-form">
        <input id="messageInput" name="message" autocomplete="off" aria-label="Consulta de destino o tramite"
          placeholder="Ej: Buscar Aula, oficina, baño" required>
        <button type="submit">➜</button>
      </form>

      <div class="quick-actions">
        <button type="button" data-example="Quiero ir al buffet">Buffet</button>
        <button type="button" data-example="Quiero ir a la oficina de alumnos">Alumnos</button>
        <button type="button" data-example="Quiero ir a biblioteca">Biblioteca</button>
        <button type="button" data-example="Quiero ir a la fotocopiadora">Fotocopiadora</button>
      </div>

    </aside>
  </main>

  <div class="places-panel">
    <h3>Directorio de Lugares</h3>
    <ul id="placesList"></ul>
  </div>

  <script type="module" src="/app.js"></script>
</body>

</html>
